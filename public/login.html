<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oilrs - ログイン</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="login.js"></script>
</head>
<body>

<header><h1>Oilrs Online - ログイン</h1></header>

<main class="auth-container">
  <section>
    <h2>ログイン</h2>
    <input type="email" id="loginEmail" placeholder="メール"><br>
    <input type="password" id="loginPassword" placeholder="パスワード"><br>
    <button id="loginBtn">ログイン</button>
  </section>

  <section>
    <h2>新規登録</h2>
    <input type="email" id="regEmail" placeholder="メール"><br>
    <input type="password" id="regPassword" placeholder="パスワード"><br>
    <button id="regBtn">登録</button>
  </section>

  <p id="message"></p>
</main>

</body>
</html>
