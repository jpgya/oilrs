<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oilrs - フレンド管理</title>
<script type="module">
import { auth, db } from "./firebaseConfig.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc, setDoc, arrayUnion, arrayRemove, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const addFriendInput = document.getElementById("addFriendInput");
const addFriendBtn = document.getElementById("addFriendBtn");
const friendList = document.getElementById("friendList");
const friendMessage = document.getElementById("friendMessage");

let currentUser;
let userDocRef;

onAuthStateChanged(auth, async (user)=>{
  if(!user){ window.location.href="index.html"; return; }
  currentUser=user;
  userDocRef = doc(db,"users",user.uid);

  // フレンド一覧リアルタイム
  onSnapshot(userDocRef, docSnap=>{
    friendList.innerHTML="";
    if(docSnap.exists()){
      const friends = docSnap.data().friends || [];
      friends.forEach(uid=>{
        const li = document.createElement("li");
        li.textContent = uid;
        // 削除ボタン
        const delBtn = document.createElement("button");
        delBtn.textContent="削除";
        delBtn.addEventListener("click",async ()=>{
          await setDoc(userDocRef,{friends:arrayRemove(uid)},{merge:true});
        });
        li.appendChild(delBtn);
        friendList.appendChild(li);
      });
    }
  });
});

// フレンド追加
addFriendBtn.addEventListener("click", async ()=>{
  const friendUid = addFriendInput.value.trim();
  if(!friendUid || !userDocRef) return;
  await setDoc(userDocRef,{friends:arrayUnion(friendUid)},{merge:true});
  friendMessage.textContent=`フレンド追加: ${friendUid}`;
  addFriendInput.value="";
});
</script>
<style>
body{font-family:Arial;background:#121212;color:#fff;padding:20px;}
input,button{padding:10px;margin:5px;border-radius:5px;border:none;}
button{cursor:pointer;background:#444;color:#fff;}
#friendList li{margin:5px 0;}
#friendMessage{color:#0f0;margin-top:10px;}
</style>
</head>
<body>
<h1>フレンド管理</h1>
<p>フレンドUIDを入力:</p>
<input type="text" id="addFriendInput" placeholder="UID">
<button id="addFriendBtn">追加</button>
<p id="friendMessage"></p>
<ul id="friendList"></ul>
<p><a href="index.html">戻る</a></p>
</body>
</html>
