<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oilrs - アカウント</title>
<link rel="stylesheet" href="style.css">
<script type="module">
import { auth, db } from "./firebaseConfig.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const nameEl = document.getElementById("name");
const avatarEl = document.getElementById("avatar");
const uidEl = document.getElementById("uid");
const friendsCountEl = document.getElementById("friendsCount");
const editBtn = document.getElementById("editBtn");
const logoutBtn = document.getElementById("logoutBtn");

onAuthStateChanged(auth, async (user)=>{
  if(!user){ window.location.href="index.html"; return; }
  
  uidEl.textContent = user.uid; // UID表示

  const userDoc = await getDoc(doc(db,"users",user.uid));
  if(userDoc.exists()){
    const data = userDoc.data();
    nameEl.textContent = data.name || "未設定";
    avatarEl.src = data.avatar || "default_avatar.png";
    friendsCountEl.textContent = (data.friends?.length || 0) + " 人";
  }
});

// 編集画面へ
editBtn.addEventListener("click", ()=>{
  window.location.href="edit_account.html";
});

// ログアウト
logoutBtn.addEventListener("click", async ()=>{
  await signOut(auth);
  window.location.href="index.html";
});
</script>
<style>
body{
  font-family:'Roboto',sans-serif;
  background:linear-gradient(135deg,#121212,#1a1a1a);
  color:#fff;
  text-align:center;
  padding:20px;
}
h1{ text-shadow:0 0 5px #0ff; }
img{width:120px;height:120px;border-radius:50%;margin:10px 0; border:2px solid #0ff;}
.info-box{
  background:#222;
  padding:15px;
  margin:10px auto;
  border-radius:10px;
  width:250px;
  text-align:left;
  box-shadow:0 0 10px #0ff;
}
.info-box p{margin:5px 0;}
button{
  padding:10px 20px;
  margin:5px;
  border-radius:8px;
  border:none;
  background:#0ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button:hover{ transform:scale(1.05); }
a{ display:block; margin-top:20px; color:#0ff; text-decoration:none;}
a:hover{text-decoration:underline;}
</style>
</head>
<body>

<h1>アカウント情報</h1>
<img id="avatar" src="default_avatar.png" alt="アバター">

<div class="info-box">
  <p>名前: <span id="name"></span></p>
  <p>UID: <span id="uid"></span></p>
  <p>フレンド数: <span id="friendsCount">0</span></p>
</div>

<button id="editBtn">編集</button>
<button id="logoutBtn">ログアウト</button>

<p><a href="index.html">戻る</a></p>

</body>
</html>
