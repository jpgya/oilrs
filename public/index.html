<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oilrs - Online</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="firebaseConfig.js"></script>
<script type="module" src="main.js"></script>
</head>
<body>

<header><h1>Oilrs Online</h1></header>

<nav>
  <button class="tab-btn active" data-tab="login">ログイン/登録</button>
  <button class="tab-btn" data-tab="news">ニュース</button>
  <button class="tab-btn" data-tab="server">サーバー情報</button>
  <button class="tab-btn" data-tab="game">ゲーム</button>
  <button class="tab-btn" data-tab="friend" onclick="location.href='friend.html'">フレンド</button>
</nav>

<main>


<section id="news">
  <h2>ニュース</h2>
  <ul id="newsList"></ul>
</section>

<section id="server">
  <h2>サーバー情報</h2>
  <p>オンラインプレイヤー数: <span id="onlineCount">0</span></p>
</section>

<section id="game">
  <h2>ゲーム画面</h2>
  <div id="gameContainer"></div>
  <p>※簡易ブロスタ風ゲーム</p>
</section>
</main>

</body>
</html>
