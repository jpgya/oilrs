<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oilrs - Online</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>
</head>
<body>


<nav>
  <button class="tab-btn active" data-tab="news">ニュース</button>
  <button class="tab-btn" data-tab="server">サーバー情報</button>
  <button class="tab-btn" onclick="location.href='game.html'">ゲーム</button>
  <button class="tab-btn" onclick="location.href='account.html'">アカウント</button>
  <button class="tab-btn" onclick="location.href='friend.html'">フレンド</button>
  <button class="tab-btn" onclick="logout()">ログアウト</button>
</nav>

<main>
  <section id="news" class="active">
    <h2>ニュース</h2>
    <ul id="newsList"></ul>
  </section>

  <section id="server">
    <h2>サーバー情報</h2>
    <p>オンラインプレイヤー数: <span id="onlineCount">0</span></p>
    <p>サーバーステータス: <span id="serverStatus">不明</span></p>

  </section>

  
</main>


</body>
</html>
