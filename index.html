
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oilrs - オイリス</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background:#121212; color:#fff; }
  header { background:#1f1f1f; padding:10px 20px; }
  header h1 { margin:0; }
  nav { display:flex; gap:10px; background:#2a2a2a; padding:10px; }
  nav button { background:none; border:none; color:#fff; padding:10px 20px; cursor:pointer; }
  nav button.active { background:#444; border-radius:5px; }
  main { padding:20px; }
  section { display:none; }
  section.active { display:block; }
</style>
</head>
<body>

<header>
  <h1>Oilrs - オイリス</h1>
</header>

<nav>
  <button class="tab-btn active" data-tab="login">ログイン</button>
  <button class="tab-btn" data-tab="news">ニュース</button>
  <button class="tab-btn" data-tab="server">サーバー情報</button>
</nav>

<main>
  <section id="login" class="active">
    <h2>ログイン</h2>
    <form id="loginForm">
      <input type="text" placeholder="ユーザー名" required><br><br>
      <input type="password" placeholder="パスワード" required><br><br>
      <button type="submit">ログイン</button>
    </form>
  </section>

  <section id="news">
    <h2>ニュース</h2>
    <ul id="newsList">
      <li>ゲームリリース予定日: 2025/11/01</li>
      <li>サーバーメンテナンス: 毎週水曜 02:00~03:00</li>
    </ul>
  </section>

  <section id="server">
    <h2>サーバー情報</h2>
    <p>オンラインプレイヤー数: <span id="onlineCount">0</span></p>
    <p>サーバー稼働時間: <span id="uptime">0分</span></p>
  </section>
</main>

<script>
  // タブ切り替え
  const buttons = document.querySelectorAll('.tab-btn');
  const sections = document.querySelectorAll('main section');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      sections.forEach(s => s.classList.remove('active'));

      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // 仮のサーバー情報更新（例）
  let online = 5;
  let minutes = 120;
  setInterval(() => {
    document.getElementById('onlineCount').textContent = online;
    document.getElementById('uptime').textContent = minutes + '分';
  }, 1000);
</script>

</body>
</html>
